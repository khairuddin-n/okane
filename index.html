<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4E">
  <meta name="description" content="okane — catatan keuangan harian, data tersimpan di Google Sheets milikmu.">
  <title>okane</title>
  <script>
    // Terapkan tema sebelum CSS dimuat supaya tidak ada kedipan putih
    (function () {
      var d = false;
      try {
        var p = localStorage.getItem('theme') || 'system';
        d = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) {}
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#0E1513' : '#0B5D4E');
    })();
  </script>
  <link rel="icon" href="./icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./version.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app">
    <div id="banner"></div>
    <main id="view"></main>
  </div>
  <nav id="nav" class="nav" aria-label="Navigasi utama"></nav>
  <div id="toast" aria-live="polite"></div>
  <div id="sheet-root"></div>
</body>
</html>
